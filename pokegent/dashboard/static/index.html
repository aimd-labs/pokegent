<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local agent dashboard</title>
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">LOCAL OPERATOR VIEW</p><h1>Agent dashboard</h1><p id="status">Waiting for telemetry…</p></header>
    <section class="grid">
      <article><h2>Game</h2><img id="frame" alt="Latest game frame"><p><a id="frame-link" hidden>Open frame.png</a></p></article>
      <article><h2>Decision</h2><pre id="decision">No decision yet.</pre></article>
      <article><h2>Audio</h2><button id="sound" type="button">Sound off</button><p class="hint">mGBA PCM: signed 16-bit little-endian, 32,768 Hz, stereo.</p></article>
      <article><h2>History</h2><ol id="history"><li>No decisions yet.</li></ol></article>
    </section>
  </main>
  <script src="/dashboard/app.js" defer></script>
</body>
</html>

      game_code: BPRE
      version: 0
      size: 16777216
    layout: firered_us_saveblocks
    # --- M2b mechanics data tables (additive). Separate from `symbols` on purpose: `symbols` in the ROM
    # region are function entry points (historical local validation), these are data. Read by
    # pokegent/games/firered/rom_tables.py. ROM addresses were located by pattern scan of the host ROM (no symbol map).
      # Method: the decomp layout of each table (src/data/*.h, struct size incl. the 4-byte padding agbcc
      # applies) was searched in the read-only host ROM; the base is the unique hit minus the index of the
      # matching entry. Each base is proven by historical local validation (names, ids, structural
      # scans of every entry, known-answer entries), run on the host ROM, 2026-10-08.
    rom_tables:
      sSpeciesToNationalPokedexNum:
        address: 0x08251FEE
        size: 822
        source: "https://github.com/pret/pokefirered/blob/037335f4/src/pokemon.c#L39 and #L512: u16[NUM_SPECIES - 1], species - 1 indexing; https://github.com/pret/pokefirered/blob/symbols/pokefirered.sym#L26908: address 08251fee, size 00000336"
        verified_by: ["Runtime: exact 411 u16 entries, first 251 equal 1..251, real species values 0..386; reserved slots 252..276 accept 0..411 and yield null"]
      gTrainers:
        address: 0x0823EAC8
        size: 29720
        source: "ROM structural scan: gTrainers[0] is the empty TRAINER_NONE row, 40-byte struct Trainer rows point forward to aligned party records; pret src/data/trainers.h and include/global.h"
        verified_by: ["world-domain ROM tests: every trainer id referenced by current-map trainerbattle scripts has a readable party and levels in 1..100"]
      gTrainerClassNames:
        address: 0x0823E558
        size: 1300
        source: "observed: unique 100x13 Gen-3 text table sequence in the host ROM; earlier AIMD Labs runtime reference: const u8 gTrainerClassNames[][13] (pret/pokefirered src/data/text/trainer_class_names.h)"
        verified_by: ["ROM decode: trainer class ids 84, 87, and 90 resolve to LEADER, ELITE FOUR, and CHAMPION, matching the in-game trainer text"]
      gWildMonHeaders:
        address: 0x083C9CB8
        size: 3400
        source: "ROM structural scan: 20-byte WildPokemonHeader rows (map group/number plus four ROM pointers), terminated by 0xFF/0xFF; pret src/data/wild_encounters.json and src/wild_encounter.c"
        verified_by: ["world-domain ROM tests: Route 1 ROM rows decode Pidgey and Rattata with the expected level ranges"]
      gBattleMoves:
        address: 0x08250C04
        size: 4260
        source: "scan: gBattleMoves[0] = 12 zero bytes immediately before MOVE_POUND {effect 0, power 40, type 0, acc 100, pp 35}; decomp: src/data/battle_moves.h const struct BattleMove gBattleMoves[MOVES_COUNT=355], ROM stride 12 (9 u8 fields padded to 4)"
        verified_by: ["rom_scan: historical local validation on the host ROM, 2026-10-08: Tackle (33) power 35 / acc 95 / pp 35 / Normal; Ember, Water Gun, Thunderbolt, Psycho Boost (354) match the decomp; all 355 entries have type < 18, target in the known masks, pp 0..40, accuracy 0..100; every move name of gMoveNames agrees with its id"]
      gSpeciesInfo:
        address: 0x08254784
        size: 11536
        source: "scan: Bulbasaur base stats {45,49,49,45,65,65,types 12/3,catch 45,exp 64} at 0x082547A0, species 0 = 28 bytes before; decomp: src/data/pokemon/species_info.h const struct SpeciesInfo gSpeciesInfo[] (named gBaseStats in older decomps), ROM stride 28"
        verified_by: ["rom_scan: historical local validation on the host ROM, 2026-10-08: Squirtle (7) base 44/48/65/43/50/64 Water; Pikachu, Charizard, Gengar, Chansey spot checks; every species 1..411 has types < 18, base stats 1..255 for real species; species names agree with ids"]
      gTypeEffectiveness:
        address: 0x0824F050
        size: 336
        source: "scan: bytes {NORMAL,ROCK,5, NORMAL,STEEL,5, FIRE,FIRE,5, FIRE,WATER,5} are unique in the ROM; decomp: src/battle_main.c const u8 gTypeEffectiveness[336] (111 triples incl. the TYPE_FORESIGHT 0xFE marker, ends with TYPE_ENDTABLE 0xFF)"
        verified_by: ["rom_scan: historical local validation on the host ROM, 2026-10-08: Water vs Fire = 20, Electric vs Ground = 0, Ghost vs Normal = 0, Fire vs Steel = 20; the table is byte-identical to the entries parsed from the decomp source; ends with the 0xFF marker; one 0xFE marker; every multiplier in {0,5,10,20}"]
      gItems:
        address: 0x083DB028
        size: 16500
        source: "scan: the text MASTER BALL (item 1) found at 0x083DB054 = gItems[1].name; decomp: src/data/items.json -> struct Item gItems[ITEMS_COUNT=375], 44 bytes each (include/item.h)"
        verified_by: ["rom_scan: historical local validation on the host ROM, 2026-10-08: every gItems[i].itemId == i (i >= 1), Potion price 300, Master Ball in the ball pocket, holdEffect of Choice Band / Leftovers / Quick Claw match the decomp constants"]
      gItemEffectTable:

# Technical address and struct profile for the FireRed reader.
# ROM identity requires matching hashes and header; unknown revisions fail closed.
# Address values were cross-checked with the earlier AIMD Labs runtime
# (MIT fork of NousResearch/pokemon-agent). Struct descriptions and constants use
# pret/pokefirered as an interoperability reference, at the revision below.
# Source notes describe technical facts, not a bundled game dataset.
# Historical validation notes are not claims that those checks ship or ran here.
schema_version: 1
pret_commit: 037335f4c725d7c9aecdac87066f2002b4bd7e14


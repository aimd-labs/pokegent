# Supported pokejev/pokegent live supervisor systemd unit drop-in.
#
# Drop this file into the transient unit's override as:
#   systemctl --user edit --runtime pokegent-live  # or place under ~/.config/systemd/user/pokegent-live.service.d/
# or pass on the systemd-run command line:
#   systemd-run --user --unit=pokegent-live \
#     -p Restart=on-failure -p RestartSec=5 \
#     -p StartLimitIntervalSec=600 -p StartLimitBurst=3 \
#     -p 'RestartPreventExitStatus=3 4 78' ...
#
# Rationale (corresponds to the supervisor's owner-review exit contract):
#  * 3 = verdict owner_review (stalled-segment limit reached) -- a human must
#        reconcile the blocked record; auto-restart just re-reads the same
#        blocked live-run.json and exits again.
#  * 4 = blocked successor/state or crash limit reached -- same need for review.
#  * 78 = reserved for the provider/monitor hard-abort; do not auto-revive.
# Bounding restarts with StartLimitIntervalSec/StartLimitBurst prevents the
# empty-port 29x restart loop reported as issue #33. Automatic restarts must
# never bypass owner review of a blocked record (docs/live-supervisor.md).

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=5
RestartPreventExitStatus=3 4 78

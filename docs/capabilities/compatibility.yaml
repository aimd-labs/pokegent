schema_version: 1
baseline_commit: c73774285e5e164d01629ca14a5e8e551e03493f
inspected_on: '2026-11-24'
status_definitions:
  present: Implementation surface exists; not proof of complete feature.
  partial: Known limited scope or incomplete evidence.
  gap: Explicit missing behavior documented.
  unknown: Not established by this audit; not a claim of absence.
  not_applicable: Only when justified for exact game.
evidence_definitions:
  path_inventory: Tracked file identified
  source_inspected: At least one relevant source or contract inspected; not all functions
  test_path: Test file identified, assertions not comprehensively audited
  documented_native_smoke: README reports native narrow smoke, not independent reproduction
  historical_ci: Baseline public checks passed; see run below
  reproduced_scenario: Exact game scenario reproduced
  reproduced_campaign: Exact campaign reproduced
  repeated_regression: Repeated scenario with stable acceptance evidence
baseline_ci:
  url: https://github.com/aimd-labs/pokegent/actions/runs/45069405352

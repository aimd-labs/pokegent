schema_version: 1
status: proposed_initial_taxonomy
baseline_commit: c73774285e5e164d01629ca14a5e8e551e03493f
scope:
  core: Ordinary gameplay and reusable agent/runtime capabilities; game-specific execution belongs to adapters.
    Core does not imply hardcoded strategy.
  addons: Specialized policies or optional external/observer integrations. System One is optional as a provider,
    but mode support is a framework capability.
  extension_rule: Add stable capability IDs per game as research identifies title-specific mechanics; this
    inventory is initial, not exhaustive.

name: Public checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Install public development dependencies
        run: python -m pip install -e '.[dev,stream]' pytest
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q pokegent addons tools tests
      - name: Import without ROM
        run: python tests/games/gen3/test_imports.py
      - name: Synthetic unit tests
        run: python -m pytest -q
      - name: Reject distributed game data
        run: python tools/check_rom_data.py

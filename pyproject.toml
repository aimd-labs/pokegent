[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokegent"
version = "0.1.1"
description = "Gen 3 FireRed agent runtime with RAM-verified actions and optional local addons."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.12"
authors = [
    {name = "AIMD Labs"},
]
keywords = ["pokemon", "ai", "agent", "emulator", "gameboy", "gba", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pyboy = ["pyboy>=2.0.0"]
# The GBA backend (pokegent/emulator.py) imports `mgba` directly: the Python bindings wheel.
# It still needs the native libmgba on the loader path at import time (LD_LIBRARY_PATH, see README).
# Install the ROM extra only for local ROM-backed tests; public CI intentionally omits it.
mgba = ["mgba>=0.10.2; platform_system == 'Linux' or platform_system == 'Darwin'"]
pygba = ["pygba>=0.1.0"]  # legacy upstream wrapper; the clean backend does not import it
stream = ["fastapi>=0.104.0", "uvicorn[standard]>=0.24.0"]
dashboard = ["fastapi>=0.104.0", "uvicorn[standard]>=0.24.0"]
system1 = []
autopilot = ["requests>=2.28"]
dev = [
    "ruff>=0.1.0",
]
# `rom` and `firered` are aliases for the binding-only `mgba` extra.
rom = ["pokegent[mgba]"]
firered = ["pokegent[mgba]"]
all = ["pokegent[pyboy,mgba,stream,dashboard,system1,autopilot]"]

[project.urls]
Homepage = "https://github.com/aimd-labs/pokegent"
Repository = "https://github.com/aimd-labs/pokegent"
Issues = "https://github.com/aimd-labs/pokegent/issues"

[project.scripts]
pokegent = "pokegent.cli:main"

[tool.setuptools.packages.find]
include = ["pokegent*", "addons*"]

[tool.setuptools.package-data]
"pokegent" = ["references/*.yaml"]
"pokegent.dashboard" = ["static/**/*", "fallback.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]


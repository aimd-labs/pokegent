# Copy to pokegent.yaml. Environment variables override this file; CLI flags win.
rom_path: /path/to/your/FireRed.gba
decider: hybrid   # hybrid | agent | system1 | first
system1: # protocols and switching: docs/system-one.md
  protocol: systemone # default custom contract; openai-chat requires request_model
  auth_header: Authorization # Bearer; custom allowed names send the raw key
  base_url: http://127.0.0.1:8799 # placeholder; set to your System One endpoint
  api_key_env: SYSTEM1_API_KEY
  # api_key: never commit real keys
  model: null # optional expected response ID; never sent
  request_model: null # optional request selector; set if required by your endpoint
  timeouts: 8
external:
  port: 19760 # must be 19700-19799
hybrid:
  escalate_below_confidence: 0.35 # or {default: 0.35, battle: 0.5}
  override_window_s: 0
  escalate_on_no_progress: true
  escalate_unknown_scene: true
  force_agent_after_repeats: 2
battle:
  opponent_knowledge: guide # guide | fair_play
field:
  menus: false
output:
  run_dir: runs
stream:
  enabled: false
  port: 19700
dashboard:
  enabled: false
  port: 19701
# Opt-in successor fallback needs private ROM encounters and resolved prerequisites.
# run:
#   on_objective_done: continue
objectives:
  fallback: "off" # dex; see docs/objective-file.md for conditions and safe-pause limits
